<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shield,electric_bolt,code,flight,vital_signs,sensors,description,help" />
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><span class="material-symbols-outlined scurity">
                        shield</span></li>
                <li>SIGINT GPS</li>
                <li id="button-sucre"><span class="button-sucre-point"></span> SECURE online</li>
            </ul>
        </nav>
    </header>
    <section class="section-radar">
        <div class='radar'>
            <div class='sweep'></div>
                <span class="point" style="top: 38%; left: 66%;"></span>
                <span class="point" style="top: 60%; left: 28%;"></span>
                <span class="point" style="top: 78%; left: 72%;"></span>
            
        </div>
        <h1 id="h1-rdar1">24</h1>
        <p id="p-rdar1">ACTIVE SIGNALS</p>
        <h1 id="h1-rdar2">07</h1>
        <p id="p-rdar2">PRIORITY ALERTS</p>
    </section>
    <section class="button">
        <button id="btn-bolt"><span class="material-symbols-outlined bolt ">
                electric_bolt
            </span> New Briel</button>
        <button id="btn-code"><span class="material-symbols-outlined code">
                code
            </span> Decode</button>
        <button id="btn-flight"> <span class="material-symbols-outlined fly">
                flight
            </span>Requset Drone</button>

    </section>
    <div class="div-4-cards">
        <div id="card1">
            <h3>In Progress</h3> <span>CRITICAL</span>
            <label for="file">Operation Nigtfall:</label>

            <progress id="file" max="100" value="65">65%</progress>\


        </div>
        <div id="card2">
            <h3>Analiyzing</h3> <span>HIGH</span>
            <label for="file">Signal Intercept Alpha:</label>

            <progress id="file" max="100" value="40">40%</progress>


        </div>

        <div id="card3">
            <h3>Pending</h3> <span>NEDIUM</span>
            <label for="file">Asset Recovery</label>

            <progress id="file" max="100" value="15">15%</progress>


        </div>
        <div id="card4">
            <h3>Active</h3> <span>HIGH</span>
            <label for="file">Cyber Defense Grid</label>

            <progress id="file" max="100" value="80">80%</progress>


        </div>

    </div>
    <div id="div-p">
         <span class="div-p-point"></span>
        <p>THREAT DETECTED</p>
    </div>
   
    <footer>
        <nav class="nav-footer">
            <ul>
                <li><span class="material-symbols-outlined vital_signs">
                        vital_signs
                    </span>
                    <h4>Dashbored</h4>
                </li>
                <li><span class="material-symbols-outlined sensors">
                        sensors
                    </span>
                    <h4>Feed</h4>
                </li>
                <li><span class="material-symbols-outlined description">
                        description
                    </span>
                    <h4>Briel</h4>
                </li>
                <li><span class="material-symbols-outlined help">
                        help
                    </span>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
